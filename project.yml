name: CamFetti
options:
  bundleIdPrefix: sh.lacy
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"
    tvOS: "18.0"
    visionOS: "2.0"
  xcodeVersion: "27.1"
  createIntermediateGroups: true
packages:
  IPCamKit:
    url: https://github.com/steelbrain/IPCamKit.git
    from: 0.3.2
settings:
  base:
    DEVELOPMENT_TEAM: DPFY6AHP57
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "1.1.2"
    CURRENT_PROJECT_VERSION: "1"
  configs:
    # Away (paid relay, not launched) compiles into Debug builds only. Release has none of it.
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: "DEBUG AWAY"
targets:
  CamFetti:
    type: application
    platform: iOS
    supportedDestinations: [iOS, macOS, tvOS, visionOS]
    sources:
      - path: Sources
        excludes: ["Mac/**"]
      - path: Sources/Mac
        destinationFilters: [macOS]
      - path: Resources
        excludes: ["*.storekit"]
    dependencies:
      - package: IPCamKit
      - target: CamFettiWatch
        destinationFilters: [iOS]
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: CamFetti
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.utilities
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes:
          - audio
        NSLocalNetworkUsageDescription: CamFetti looks for cameras on your Wi-Fi and plays their video.
        NSBonjourServices:
          - _thingino._tcp
          - _rtsp._tcp
          - _rtsps._tcp
        NSPhotoLibraryAddUsageDescription: CamFetti saves snapshots you take to your photo library.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: sh.lacy.camfetti
        TARGETED_DEVICE_FAMILY: "1"
        TARGETED_DEVICE_FAMILY[sdk=appletv*]: "3"
        TARGETED_DEVICE_FAMILY[sdk=xr*]: "7"
        CODE_SIGN_ENTITLEMENTS[sdk=macosx*]: Mac/CamFetti.entitlements
        ENABLE_HARDENED_RUNTIME[sdk=macosx*]: YES
        ENABLE_APP_SANDBOX[sdk=macosx*]: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_APPICON_NAME[sdk=appletv*]: "App Icon & Top Shelf Image"
        ASSETCATALOG_COMPILER_APPICON_NAME[sdk=xr*]: VisionAppIcon
        ASSETCATALOG_COMPILER_STANDALONE_ICON_BEHAVIOR: all # App Store needs every Mac size in the .icns, not only Assets.car
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  CamFettiWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: WatchApp
      - path: Sources/UI/Theme.swift
      - path: Sources/Watch/WatchProtocol.swift
      - path: Sources/Watch/AgeText.swift
    info:
      path: WatchApp/Info.plist
      properties:
        CFBundleDisplayName: CamFetti
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        WKCompanionAppBundleIdentifier: sh.lacy.camfetti
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: sh.lacy.camfetti.watchkitapp
        TARGETED_DEVICE_FAMILY: "4"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  CamFettiTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: CamFetti
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: sh.lacy.camfetti.tests
        GENERATE_INFOPLIST_FILE: YES
  CamFettiUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: CamFetti
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: sh.lacy.camfetti.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: CamFetti
schemes:
  CamFetti:
    build:
      targets:
        CamFetti: all
        CamFettiTests: [test]
        CamFettiUITests: [test]
    run:
      config: Debug
      storeKitConfiguration: Resources/CamFetti.storekit
    test:
      config: Debug
      storeKitConfiguration: Resources/CamFetti.storekit
      targets:
        - CamFettiTests
        - CamFettiUITests
    archive:
      config: Release
